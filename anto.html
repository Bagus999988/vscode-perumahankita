<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>perumahankita</title>
    <link rel="stylesheet" href="anto.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="#" class="logo">Perumahankita</a>
        <nav class="site-nav">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="site-hero">
      <div class="container hero-content">
        <h1>Find, Sell, or Rent Your Perfect Home</h1>
        <p>Your trusted partner for buying, selling, and renting houses.</p>
      </div>

      <div class="container hero-search">
        <form action="#" method="get" class="search-form">
          <input
            type="text"
            name="location"
            placeholder="Enter location"
            required
          />
          <select name="property-type">
            <option value="">Select property type</option>
            <option value="Sell">Sell</option>
            <option value="Buy">Buy</option>
            <option value="Rent">Rent</option>
          </select>
          <button class="search-button" type="submit">Search</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Perumahankita All rights reserved.</p>
      </div>
    </footer>

    <script src="anto.js"></script>
  </body>
</html>
